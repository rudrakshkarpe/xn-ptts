[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phonon-aiperf"
version = "0.1.0"
description = "AIPerf endpoint adapter for Phonon PCM speech"
requires-python = ">=3.11"
dependencies = ["aiperf==0.13.0"]

[project.entry-points."aiperf.plugins"]
phonon_aiperf = "phonon_aiperf:plugins.yaml"

[tool.hatch.build.targets.wheel]
packages = ["phonon_aiperf"]
